name: Sport science bot

on:
  schedule:
    # every 20 minutes, 08:00–23:40 Tashkent time (UTC+5)
    - cron: "*/20 3-18 * * *"
  workflow_dispatch:
    inputs:
      draft_now:
        description: "Prepare a new post right now (sent to you for approval)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sport-science-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_DRAFT: ${{ inputs.draft_now }}
      - name: Save bot memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update bot state" && git push)
